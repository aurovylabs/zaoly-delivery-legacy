<!--
  Reusable bilingual section pattern for weekly Listmonk campaign bodies.
  Copy one block per section. Shared H2 spans full width; EN/DE paste zones side by side.
  Outlook keeps the two columns; mobile stacks via .stack-column in the template <style>.
-->
<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
  <tr>
    <td style="padding:32px 28px 8px; border-bottom:1px solid #e2e0d8;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
        <tr>
          <td width="36" valign="top" style="font-family:Arial, Helvetica, sans-serif; font-size:12px; font-weight:700; letter-spacing:0.12em; color:#1f44ff;">0X</td>
          <td valign="top" style="font-family:Arial, Helvetica, sans-serif; font-size:24px; line-height:1.15; font-weight:700; color:#000000; border-bottom:2px solid #0f172a; padding-bottom:8px;">
            Section heading (not translated)
          </td>
        </tr>
      </table>
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin-top:18px;">
        <tr>
          <td class="stack-column paste-zone" width="50%" valign="top" style="padding-right:14px; font-family:Arial, Helvetica, sans-serif;">
            <span class="lang-label">EN</span>
            <!-- Paste English Word content here (prefer Paste as plain text, then re-apply bold/links) -->
            <p style="margin:0; font-size:14px; line-height:1.55; color:#0f172a;">English body…</p>
            <blockquote style="margin:12px 0 0 0; padding:10px 12px; border-left:3px solid #1f44ff; background:#efeee9; font-size:13px; color:#334155;">Permanent link callout…</blockquote>
          </td>
          <td class="stack-column paste-zone" width="50%" valign="top" style="padding-left:14px; font-family:Arial, Helvetica, sans-serif;">
            <span class="lang-label">DE</span>
            <!-- Paste German Word content here -->
            <p style="margin:0; font-size:14px; line-height:1.55; color:#0f172a;">Deutscher Text…</p>
            <blockquote style="margin:12px 0 0 0; padding:10px 12px; border-left:3px solid #1f44ff; background:#efeee9; font-size:13px; color:#334155;">Permanenter Link-Hinweis…</blockquote>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
